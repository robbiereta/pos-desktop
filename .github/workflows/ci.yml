name: CI

on:
  push:
    branches: [master, stage]
  pull_request:
    branches: [master, stage]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint --if-present

      - name: Build renderer
        run: npm run build

      - name: Build Electron (no pack)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --dir --config.asar=false
        continue-on-error: false

      - name: Verify output
        run: |
          echo "dist/ contents:"
          ls -la dist/
          echo ""
          echo "out/ contents:"
          ls -la out/
